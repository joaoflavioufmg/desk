name: Docs

on:
  push:
    branches:
      - main

jobs:
  rtd:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Read the Docs build
        run: |
          curl -X POST \
            -H "Authorization: Token ${{ secrets.RTD_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://readthedocs.org/api/v3/projects/desk/versions/latest/builds/
