[build-system]
requires = ["setuptools>=60"]
requires-python = ">=3.10,<3.14"
build-backend = "setuptools.build_meta"

[project]
name = "desk-sim"
version = "1.0.2"
description = "DESK: Discrete Event Simulation Kit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
authors = [
  { name = "João Flávio", email = "joao.flavio@dep.ufmg.br" }
]

keywords = [
  "discrete-event-simulation",
  "simulation",
  "operations-research",
  "healthcare",
  "logistics",
  "analytics"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: GPL-3.0 License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11"
]

dependencies = [
  "numpy==1.26.4",
  "scipy==1.11.4",
  "pandas==2.0.3",
  "matplotlib==3.8.4",
  "seaborn==0.13.2",
  "simpy==4.1"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "black",
  "isort",
  "flake8",
  "build",
  "twine",
  "mkdocs",
  "mkdocs-material"
]

[project.urls]
Homepage = "https://joaoflavioufmg.github.io/desk"
Repository = "https://github.com/joaoflavioufmg/desk"
Issues = "https://github.com/joaoflavioufmg/desk/issues"

[tool.setuptools]
packages = { find = { exclude = ["tests*", "docs*", "examples*", "scripts*", "venv*"] } }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"